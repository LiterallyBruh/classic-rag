services:
  app:
    build: .
    ports: ["8501:8501"]
    env_file:
      - path: .env
        required: false  # без ключа демо работает в режиме «только фрагменты»
    volumes:
      - ./data:/app/data          # корпус и индекс переживают пересборку
      - hf-cache:/app/.cache/huggingface

volumes:
  hf-cache:
